<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Car Loan Calculator</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#737373;--border:#dcdcdf;--soft:#f8f8f9;--selected:#e4e4e7}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{width:min(560px,100%);margin:0 auto;padding:16px 14px 22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:21px;line-height:1.1;font-weight:800}
.top-actions{display:flex;gap:30px;flex-shrink:0}
.top-actions button{border:0;background:transparent;padding:10px 4px;font-size:15px;font-weight:800;color:#555;min-height:44px;min-width:56px}
.share,.clear{background:transparent;color:#555}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.grid-price{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}
input{width:100%;height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;color:#111;padding:0 10px;font-size:16px;outline:none}
input:focus{border-color:#999}
.money{position:relative}.money span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}.money input{padding-left:27px}
.result{height:42px;border:1px solid var(--border);border-radius:10px;background:var(--soft);display:flex;align-items:center;padding:0 10px;font-size:18px;font-weight:800}
.loan-input{font-size:18px;font-weight:800;background:var(--soft)}
.options{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.option{height:44px;border:1px solid var(--border);border-radius:9px;background:#fff;color:#111;font-size:12.5px;font-weight:800;padding:0 3px}
.option.active{background:var(--selected);border-color:#bfc0c4}.customBox{text-align:center;padding:0 3px}.customBox:focus{background:var(--selected);border-color:#bfc0c4}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:3px}
.summary-box{border:1px solid var(--border);border-radius:12px;background:var(--soft);padding:11px 11px}
.summary-box .k{font-size:11.5px;font-weight:800;margin-bottom:3px}
.summary-box .v{font-size:20px;font-weight:900;line-height:1.1}
.summary-box:first-child .v{font-size:23px}
.credit{text-align:center;margin-top:12px;font-size:11px;color:var(--muted)}

@media(max-width:380px){.app{padding:11px 9px 16px}.card{padding:13px}h1{font-size:19px}.option{font-size:11.5px}.field{margin-bottom:10px}}

@media(min-width:700px){
  .app{width:min(720px,100%);padding:28px 24px 34px}
  .topbar{margin-bottom:18px}
  h1{font-size:25px}
  .top-actions button{font-size:16px}
  .card{padding:22px;border-radius:22px}
  .grid-price{gap:14px}
  .field{margin-bottom:15px}
  label{font-size:13px;margin-bottom:6px}
  input,.result{height:48px;font-size:18px}
  .result,.loan-input{font-size:20px}
  .options{gap:9px}
  .option{height:48px;font-size:14px;border-radius:11px}
  .summary{gap:14px;margin-top:5px}
  .summary-box{padding:14px}
  .summary-box .k{font-size:12.5px}
  .summary-box .v{font-size:23px}
  .summary-box:first-child .v{font-size:27px}
  .credit{font-size:12px;margin-top:14px}
}

</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Car Loan">

</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Car Loan Calculator</h1>
    <div class="top-actions">
      <button class="share" id="shareBtn">Share</button>
      <button class="clear" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="card">
    <div class="grid-price">
      <div class="field">
        <label>Car price</label>
        <div class="money"><span>$</span><input id="price" type="text" inputmode="numeric" value=""></div>
      </div>
      <div class="field">
        <label>Promo</label>
        <div class="money"><span>$</span><input id="promo" type="text" inputmode="numeric" value="0"></div>
      </div>
    </div>

    <div class="field">
      <label>Effective price</label>
      <div class="result" id="effective">$200,000</div>
    </div>

    <div class="field">
      <label>Loan percentage</label>
      <div class="options">
        <button class="option loanBtn" data-v="50">50%</button>
        <button class="option loanBtn active" data-v="60">60%</button>
        <button class="option loanBtn" data-v="90">90%</button>
        <input class="option customBox" id="loanCustomInput" type="text" inputmode="decimal" aria-label="Custom loan percentage">
      </div>
    </div>

    <div class="field">
      <label>Loan amount</label>
      <div class="money"><span>$</span><input class="loan-input" id="loan" type="text" inputmode="numeric" value="120,000"></div>
    </div>

    <div class="field">
      <label>Interest rate</label>
      <div class="options">
        <button class="option rateBtn" data-v="2.28">2.28%</button>
        <button class="option rateBtn active" data-v="2.6">2.60%</button>
        <button class="option rateBtn" data-v="2.98">2.98%</button>
        <input class="option customBox" id="rateCustomInput" type="text" inputmode="decimal" aria-label="Custom interest rate">
      </div>
    </div>

    <div class="field">
      <label>Loan tenure</label>
      <div class="options">
        <button class="option termBtn" data-v="5">5 yr</button>
        <button class="option termBtn active" data-v="7">7 yr</button>
        <button class="option termBtn" data-v="10">10 yr</button>
        <input class="option customBox" id="termCustomInput" type="text" inputmode="numeric" aria-label="Custom loan tenure">
      </div>
    </div>

    <div class="summary">
      <div class="summary-box"><div class="k">Monthly instalment</div><div class="v" id="monthly">$1,689</div></div>
      <div class="summary-box"><div class="k">Down payment</div><div class="v" id="down">$80,000</div></div>
    </div>
  </div>
  <div class="credit">Bernice Chua | @bernice.mercedes</div>
</div>

<script>
const $=id=>document.getElementById(id);
const price=$("price"),promo=$("promo"),loan=$("loan");
const loanCustom=$("loanCustomInput"),rateCustom=$("rateCustomInput"),termCustom=$("termCustomInput");
let loanPct=60,rate=2.6,term=7,loanMode="percentage";
const STORAGE_KEY="carLoanCalculatorStateV1";

function activePreset(cls){
  const b=document.querySelector(cls+".active[data-v]");
  return b ? b.dataset.v : null;
}
function saveState(){
  const state={
    price: raw(price),
    priceBlank: price.value.trim()==="",
    promo: raw(promo),
    loan: raw(loan),
    loanPct, rate, term, loanMode,
    loanPreset: activePreset(".loanBtn"),
    ratePreset: activePreset(".rateBtn"),
    termPreset: activePreset(".termBtn")
  };
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
}
function restoreSelection(cls,preset,customEl,type,value){
  clearClass(cls);
  clearCustom(customEl);
  if(preset!==null && preset!==undefined){
    const b=document.querySelector(`${cls}[data-v="${preset}"]`);
    if(b)b.classList.add("active");
  }else{
    customEl.classList.add("active");
    displayCustom(customEl,type,value);
  }
}
function loadState(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")}catch(e){}
  if(!s)return false;

  price.value=s.priceBlank ? "" : Number(s.price||0).toLocaleString("en-SG");
  promo.value=Number(s.promo||0).toLocaleString("en-SG");
  loan.value=Number(s.loan||0).toLocaleString("en-SG");
  loanPct=Number.isFinite(Number(s.loanPct))?Number(s.loanPct):60;
  rate=Number.isFinite(Number(s.rate))?Number(s.rate):2.6;
  term=Number.isFinite(Number(s.term))?Number(s.term):7;
  loanMode=s.loanMode==="amount"?"amount":"percentage";

  restoreSelection(".loanBtn",s.loanPreset,loanCustom,"loan",loanPct);
  restoreSelection(".rateBtn",s.ratePreset,rateCustom,"rate",rate);
  restoreSelection(".termBtn",s.termPreset,termCustom,"term",term);
  calc();
  return true;
}

function raw(el){return Math.max(0,Math.floor(Number(String(el.value).replace(/,/g,""))||0))}
function numFromCustom(el){return Number(String(el.value).replace(/[^0-9.]/g,""))}
function fmt(n){return "$"+Math.max(0,Math.round(n)).toLocaleString("en-SG")}
function fmtInput(el){el.value=raw(el).toLocaleString("en-SG")}
function eff(){return Math.max(0,raw(price)-raw(promo))}
function clearClass(cls){document.querySelectorAll(cls).forEach(b=>b.classList.remove("active"))}
function clearCustom(el){el.value="";el.classList.remove("active")}
function displayCustom(el,type,value){
  if(type==="loan") el.value=(Number(value).toFixed(1).replace(/\.0$/,""))+"%";
  if(type==="rate") el.value=Number(value).toFixed(2)+"%";
  if(type==="term") el.value=Math.round(Number(value))+" yr";
}

function fromPct(){
  loan.value=Math.floor(eff()*loanPct/100).toLocaleString("en-SG");
}
function calc(){
  const e=eff();
  $("effective").textContent=fmt(e);
  let l=Math.min(e,raw(loan));
  if(document.activeElement!==loan) loan.value=l.toLocaleString("en-SG");
  const total=l+(l*(rate/100)*term);
  $("monthly").textContent=fmt(term>0?Math.ceil(total/(term*12)):0);
  $("down").textContent=fmt(Math.max(0,e-l));
  saveState();
}

document.querySelectorAll(".loanBtn[data-v]").forEach(b=>b.onclick=()=>{
  loanPct=Number(b.dataset.v); loanMode="percentage";
  clearClass(".loanBtn"); b.classList.add("active"); clearCustom(loanCustom);
  fromPct(); calc();
});
document.querySelectorAll(".rateBtn[data-v]").forEach(b=>b.onclick=()=>{
  rate=Number(b.dataset.v);
  clearClass(".rateBtn"); b.classList.add("active"); clearCustom(rateCustom);
  calc();
});
document.querySelectorAll(".termBtn[data-v]").forEach(b=>b.onclick=()=>{
  term=Number(b.dataset.v);
  clearClass(".termBtn"); b.classList.add("active"); clearCustom(termCustom);
  calc();
});

function prepCustom(el, cls, currentValue){
  clearClass(cls); el.classList.add("active");
  el.value=currentValue;
  requestAnimationFrame(()=>el.select());
}
loanCustom.addEventListener("focus",()=>prepCustom(loanCustom,".loanBtn",loanPct.toFixed(1).replace(/\.0$/,"")));
rateCustom.addEventListener("focus",()=>prepCustom(rateCustom,".rateBtn",rate));
termCustom.addEventListener("focus",()=>prepCustom(termCustom,".termBtn",Math.round(term)));

loanCustom.addEventListener("input",()=>{
  const v=numFromCustom(loanCustom);
  if(Number.isFinite(v)&&v>=0){
    loanPct=Math.min(100,v); loanMode="percentage";
    fromPct(); calc();
  }
});
rateCustom.addEventListener("input",()=>{
  const v=numFromCustom(rateCustom);
  if(Number.isFinite(v)&&v>=0){rate=v;calc()}
});
termCustom.addEventListener("input",()=>{
  const v=Math.floor(numFromCustom(termCustom));
  if(Number.isFinite(v)&&v>=1){
    term=Math.min(10,v);
    if(v>10) termCustom.value="10";
    calc();
  }
});

loanCustom.addEventListener("blur",()=>{
  const v=numFromCustom(loanCustom);
  if(Number.isFinite(v)&&v>=0){loanPct=Math.min(100,v);displayCustom(loanCustom,"loan",loanPct)}
});
rateCustom.addEventListener("blur",()=>{
  const v=numFromCustom(rateCustom);
  if(Number.isFinite(v)&&v>=0){rate=v;displayCustom(rateCustom,"rate",rate)}
});
termCustom.addEventListener("blur",()=>{
  const v=Math.floor(numFromCustom(termCustom));
  if(Number.isFinite(v)&&v>=1){
    term=Math.min(10,v);
    termCustom.value=term+" yr";
  }
});

[price,promo,loan].forEach(el=>{
  el.addEventListener("focus",()=>{
    if(el===promo && raw(promo)===0){promo.value="";return}
    el.value=String(el.value).replace(/,/g,"");
    requestAnimationFrame(()=>el.select());
  });
  el.addEventListener("blur",()=>{
    if(el===promo && el.value.trim()==="")promo.value="0";
    if(el===loan && raw(loan)>eff()) loan.value=eff().toLocaleString("en-SG");
    fmtInput(el);
    if((el===price||el===promo)&&loanMode==="percentage")fromPct();
    calc();
  });
});
price.addEventListener("input",()=>{if(loanMode==="percentage")fromPct();calc()});
promo.addEventListener("input",()=>{if(loanMode==="percentage")fromPct();calc()});
loan.addEventListener("input",()=>{
  loanMode="amount";
  const e=eff(),l=raw(loan);
  loanPct=e?Math.min(100,l/e*100):0;
  clearClass(".loanBtn");
  loanCustom.classList.add("active");
  loanCustom.value=loanPct?loanPct.toFixed(1).replace(/\.0$/,""):"";
  calc();
});
loan.addEventListener("blur",()=>{
  if(loanCustom.classList.contains("active") && loanCustom.value!==""){
    displayCustom(loanCustom,"loan",loanPct);
  }
});

$("clearBtn").onclick=()=>{
  try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
  price.value="";promo.value="0";loan.value="0";
  loanPct=60;rate=2.6;term=7;loanMode="percentage";
  clearClass(".loanBtn");document.querySelector('.loanBtn[data-v="60"]').classList.add("active");clearCustom(loanCustom);
  clearClass(".rateBtn");document.querySelector('.rateBtn[data-v="2.6"]').classList.add("active");clearCustom(rateCustom);
  clearClass(".termBtn");document.querySelector('.termBtn[data-v="7"]').classList.add("active");clearCustom(termCustom);
  calc();price.focus();
};

  rrect(boxX,y,boxW,boxH,24,paleBlue);
  ctx.fillStyle="#a9cfe6";ctx.fillRect(540,y+28,2,boxH-56);
  ctx.fillStyle=muted;ctx.font="700 31px Arial";
  ctx.fillText("Down Payment",130,y+58);
  ctx.fillText("Monthly Instalment",600,y+58);
  ctx.fillStyle=text;ctx.font="700 54px Arial";
  ctx.fillText(money(dp),130,y+132);
  ctx.fillText(money(monthly),600,y+132);

  ctx.fillStyle="#6f7782";ctx.font="400 30px Arial";ctx.textAlign="center";
  ctx.fillText("Bernice Chua | @bernice.mercedes",W/2,1365);
  ctx.textAlign="left";

  return await new Promise(resolve=>c.toBlob(resolve,"image/png",1));
}

$("shareBtn").onclick=async()=>{
  try{
    const blob=await buildShareImage();

    // First try native file sharing.
    try{
      const file=new File([blob],"car-loan-summary.png",{type:"image/png"});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
    }catch(e){}

    // Fallback for browsers/PWAs that do not support sharing generated File objects.
    // Download the PNG so the user can share the actual image from Downloads/Gallery.
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="car-loan-summary.png";
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);

    alert("Share image created. Open Downloads to share the PNG.");
  }catch(e){
    alert("Unable to create share image.");
  }
};

if(!loadState()){fromPct();calc();}
